<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rumah di Tengah Angin</title>
  <link rel="stylesheet" href="style.css">
  <script>if (/[?&]exit=1/.test(location.search)) document.documentElement.classList.add('arriving');</script>
</head>
<body>

  <main class="scene" id="hero">
    <svg id="scene" viewBox="0 0 800 613" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Rumah kecil dengan lampu menyala di tengah angin, pohon bergoyang dan awan berjalan">

      <defs>
        <radialGradient id="lampGlow">
          <stop offset="0" stop-color="#ffd27a" stop-opacity=".8"/>
          <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="groundGlow">
          <stop offset="0" stop-color="#ffd27a" stop-opacity=".65"/>
          <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="interior" cx="50%" cy="55%" r="70%">
          <stop offset="0" stop-color="#fffbe6"/>
          <stop offset=".6" stop-color="#ffe8a0"/>
          <stop offset="1" stop-color="#ffc95e"/>
        </radialGradient>
        <linearGradient id="spill" gradientUnits="userSpaceOnUse" x1="386" y1="293" x2="240" y2="395">
          <stop offset="0" stop-color="#ffe39a" stop-opacity=".95"/>
          <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="burst">
          <stop offset="0"   stop-color="#fffdf0" stop-opacity="1"/>
          <stop offset=".35" stop-color="#ffeaa6" stop-opacity=".85"/>
          <stop offset="1"   stop-color="#ffd27a" stop-opacity="0"/>
        </radialGradient>
        <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <g id="camera">

      <g class="clouds">
        <g transform="translate(0,40)">
          <g class="cloud" style="--d:290s; --s:-109s">
            <g fill="#eef1f6" opacity=".95">
              <rect x="0" y="28" width="190" height="24" rx="12"/>
              <circle cx="70" cy="26" r="24"/>
              <circle cx="118" cy="18" r="28"/>
              <circle cx="160" cy="34" r="16"/>
            </g>
            <rect x="190" y="40" width="90" height="8" rx="4" fill="#e3e8f0"/>
          </g>
        </g>
        <g transform="translate(0,22)">
          <g class="cloud" style="--d:330s; --s:-179s">
            <g fill="#eef1f6" opacity=".95">
              <rect x="0" y="20" width="155" height="22" rx="11"/>
              <circle cx="50" cy="22" r="17"/>
              <circle cx="98" cy="14" r="22"/>
            </g>
            <rect x="160" y="26" width="90" height="8" rx="4" fill="#e3e8f0"/>
          </g>
        </g>
        <g transform="translate(0,105)">
          <g class="cloud" style="--d:300s; --s:-178s">
            <g fill="#eef1f6" opacity=".95">
              <rect x="0" y="15" width="140" height="20" rx="10"/>
              <circle cx="45" cy="16" r="14"/>
              <circle cx="88" cy="10" r="18"/>
            </g>
            <rect x="140" y="22" width="40" height="7" rx="3.5" fill="#e3e8f0"/>
          </g>
        </g>
        <g transform="translate(0,8)">
          <g class="cloud" style="--d:360s; --s:-173s">
            <g fill="#e9edf4" opacity=".8">
              <rect x="0" y="16" width="110" height="16" rx="8"/>
              <circle cx="38" cy="16" r="12"/>
              <circle cx="72" cy="12" r="14"/>
            </g>
          </g>
        </g>
      </g>

      <ellipse class="ground-shadow" cx="400" cy="490" rx="330" ry="52" fill="#b4bccb"/>

      <g class="island">

        <polygon points="68,325 405,500 405,520 68,345" fill="#8aa396"/>
        <polygon points="405,500 750,328 750,348 405,520" fill="#738e7f"/>

        <polygon points="68,325 412,150 750,328 405,500" fill="#a9c3b5"/>
        <polygon points="68,325 412,150 750,328 405,500" fill="none" stroke="#bcd2c6" stroke-width="2"/>

        <polygon points="352,305 402,330 252,405 202,380" fill="#c9d3c4"/>
        <g stroke="#b3bfae" stroke-width="1.6" stroke-linecap="round">
          <line x1="337" y1="312" x2="387" y2="337"/>
          <line x1="312" y1="325" x2="362" y2="350"/>
          <line x1="282" y1="340" x2="332" y2="365"/>
          <line x1="252" y1="355" x2="302" y2="380"/>
          <line x1="226" y1="368" x2="276" y2="393"/>
        </g>

        <ellipse cx="305" cy="324" rx="100" ry="34" fill="url(#groundGlow)" class="glow-pulse"/>
        <ellipse cx="385" cy="322" rx="62" ry="22" fill="url(#groundGlow)" opacity=".8"/>

        <polygon class="door-spill" points="366,283 406,303 335,425 150,382" fill="url(#spill)"/>

        <ellipse cx="212" cy="287" rx="42" ry="14" fill="#8ba598"/>
        <ellipse cx="622" cy="354" rx="46" ry="14" fill="#8ba598"/>
        <ellipse cx="482" cy="438" rx="28" ry="9" fill="#8ba598"/>

        <g transform="translate(192,285)">
          <g class="tree" style="--a:-2.2; --b:3.4; --dur:4.6s; --delay:-1s">
            <path d="M-4,0 C-6,-40 6,-70 28,-98 L38,-92 C18,-64 8,-36 6,0 Z" fill="#7a5547"/>
            <g transform="translate(32,-96)">
              <g class="canopy" style="--a:-1.6; --b:2.2; --dur:2.9s; --delay:-.4s">
                <circle cx="2"  cy="-20" r="38" fill="#86ab98"/>
                <circle cx="38" cy="-12" r="32" fill="#6b8f7d"/>
                <circle cx="30" cy="-52" r="40" fill="#79a08b"/>
                <circle cx="72" cy="-46" r="25" fill="#6c927e"/>
                <circle cx="8"  cy="-62" r="22" fill="#82a894"/>
              </g>
            </g>
          </g>
        </g>

        <g id="house">

          <polygon points="392,90 586,182 586,277 470,334 300,160" fill="#e8e6da"/>

          <polygon points="488,128 511,139 511,185 488,174" fill="#b86f62"/>
          <polygon points="511,139 534,127 534,173 511,185" fill="#9e5648"/>
          <polygon points="484,124 513,138 513,146 484,132" fill="#4c5a78"/>
          <polygon points="513,138 538,126 538,134 513,146" fill="#3f4c68"/>
          <polygon points="484,124 508,112 538,126 513,138" fill="#71809c"/>
          <polygon points="498,121 508,116 524,123 514,128" fill="#3a4660"/>

          <g transform="translate(470,254) skewY(-26.57)">
            <rect x="0" y="0" width="112" height="80" fill="#d7d5c8"/>
            <rect x="0" y="74" width="112" height="6" fill="#bdbbad"/>
            <g class="window-flicker">
              <rect x="48" y="18" width="36" height="44" fill="#f6c866"/>
              <rect x="48" y="18" width="36" height="44" fill="none" stroke="#3d4965" stroke-width="3.5"/>
              <line x1="66" y1="18" x2="66" y2="62" stroke="#3d4965" stroke-width="2.5"/>
              <line x1="48" y1="40" x2="84" y2="40" stroke="#3d4965" stroke-width="2.5"/>
            </g>
          </g>

          <g transform="translate(310,175) skewY(26.57)">
            <rect x="0" y="0" width="160" height="80" fill="#e8e6da"/>
            <rect x="0" y="0" width="160" height="10" fill="#cfcdbf" opacity=".7"/>
            <rect x="0" y="74" width="160" height="6" fill="#bdbbad"/>

            <g class="window-flicker">
              <rect x="8" y="22" width="40" height="40" fill="#f6c866"/>
              <rect x="8" y="22" width="40" height="40" fill="none" stroke="#3d4965" stroke-width="3.5"/>
              <line x1="28" y1="22" x2="28" y2="62" stroke="#3d4965" stroke-width="2.5"/>
              <line x1="8" y1="42" x2="48" y2="42" stroke="#3d4965" stroke-width="2.5"/>
            </g>
            <rect x="4" y="62" width="48" height="9" rx="1" fill="#6b5a52"/>
            <circle cx="14" cy="60" r="5.5" fill="#76a584"/>
            <circle cx="28" cy="59" r="6" fill="#6a9a79"/>
            <circle cx="42" cy="60" r="5.5" fill="#76a584"/>

            <g class="window-flicker" style="--delay:-2s">
              <rect x="108" y="22" width="40" height="40" fill="#f6c866"/>
              <rect x="108" y="22" width="40" height="40" fill="none" stroke="#3d4965" stroke-width="3.5"/>
              <line x1="128" y1="22" x2="128" y2="62" stroke="#3d4965" stroke-width="2.5"/>
              <line x1="108" y1="42" x2="148" y2="42" stroke="#3d4965" stroke-width="2.5"/>
            </g>
            <rect x="104" y="62" width="48" height="9" rx="1" fill="#6b5a52"/>
            <circle cx="114" cy="60" r="5.5" fill="#76a584"/>
            <circle cx="128" cy="59" r="6" fill="#6a9a79"/>
            <circle cx="142" cy="60" r="5.5" fill="#76a584"/>

            <g id="door" class="door" role="button" tabindex="0" aria-label="Buka pintu rumah">
              <rect class="door-frame" x="52" y="6" width="48" height="74" fill="#e8e6da" stroke="#cfcdbf" stroke-width="2"/>

              <rect x="56" y="10" width="40" height="70" fill="url(#interior)"/>

              <g class="door-panel">
                <rect x="56" y="10" width="40" height="70" fill="#f4c76a"/>
                <rect x="56" y="10" width="40" height="70" fill="none" stroke="#e3a94a" stroke-width="2"/>
                <rect x="60" y="14" width="32" height="20" fill="#f9dc94" opacity=".7"/>
                <rect x="60" y="40" width="32" height="34" fill="#f9dc94" opacity=".35"/>
                <circle class="bell-ring" cx="76" cy="52" r="9" fill="none" stroke="#fff" stroke-width="2"/>
                <circle cx="76" cy="52" r="7" fill="#f6e3b0" stroke="#fff" stroke-width="2"/>
                <circle cx="76" cy="52" r="3" fill="#3d4965"/>
                <rect class="door-shade" x="56" y="10" width="40" height="70" fill="#7a4b12" opacity="0"/>
              </g>

              <rect x="50" y="4" width="54" height="78" fill="transparent"/>
            </g>

            <rect x="50" y="80" width="54" height="9" fill="#eceae2"/>
            <rect x="50" y="86" width="54" height="3" fill="#cfcdbf"/>
          </g>

          <polygon points="355,82 527,170 472,248 300,160" fill="#5d7094"/>
          <g stroke="#51617f" stroke-width="1.6">
            <line x1="311" y1="144" x2="483" y2="232"/>
            <line x1="322" y1="128" x2="494" y2="216"/>
            <line x1="333" y1="113" x2="505" y2="201"/>
            <line x1="344" y1="97"  x2="516" y2="185"/>
          </g>
          <line x1="355" y1="82" x2="527" y2="170" stroke="#4a5878" stroke-width="4" stroke-linecap="round"/>
          <polygon points="300,160 472,248 472,257 300,169" fill="#2f3b57"/>
          <line x1="355" y1="82" x2="300" y2="160" stroke="#2f3b57" stroke-width="5" stroke-linecap="round"/>
        </g>

        <g class="smoke" fill="#fff">
          <circle cx="516" cy="102" r="6"  style="--delay:0s"/>
          <circle cx="516" cy="102" r="7"  style="--delay:-1.2s"/>
          <circle cx="516" cy="102" r="8"  style="--delay:-2.4s"/>
          <circle cx="516" cy="102" r="9"  style="--delay:-3.6s"/>
          <circle cx="516" cy="102" r="10" style="--delay:-4.8s"/>
        </g>

        <g transform="translate(278,312)">
          <circle class="glow-pulse" cx="0" cy="-86" r="38" fill="url(#lampGlow)"/>
          <rect x="-2.5" y="-76" width="5" height="76" fill="#2a3650"/>
          <rect x="-6" y="-6" width="12" height="6" fill="#2a3650"/>
          <rect x="-11" y="-98" width="22" height="24" fill="#f5d47a" stroke="#2a3650" stroke-width="2.5"/>
          <line x1="0" y1="-98" x2="0" y2="-74" stroke="#2a3650" stroke-width="1.5"/>
          <polygon points="-14,-98 0,-110 14,-98" fill="#2a3650"/>
        </g>

        <g transform="translate(598,352)">
          <g class="tree" style="--a:-3.2; --b:2.2; --dur:4.1s; --delay:-2.3s">
            <path d="M-3,0 C-2,-26 6,-52 18,-72 L26,-66 C16,-48 8,-26 6,0 Z" fill="#7a5547"/>
            <g transform="translate(22,-70)">
              <g class="canopy" style="--a:-2; --b:1.6; --dur:3.1s; --delay:-1.1s">
                <circle cx="22" cy="-20" r="32" fill="#6b8f7d"/>
                <circle cx="50" cy="-14" r="28" fill="#79a08b"/>
                <circle cx="32" cy="-52" r="40" fill="#7ea58f"/>
                <circle cx="62" cy="-57" r="26" fill="#6a917c"/>
                <circle cx="10" cy="-46" r="20" fill="#86ab98"/>
              </g>
            </g>
          </g>
        </g>

        <g id="fence"></g>

        <g transform="translate(466,430)">
          <g class="tree" style="--a:-2.8; --b:3.6; --dur:3.6s; --delay:-.6s">
            <path d="M-3,0 C-5,-14 -3,-28 4,-42 L10,-40 C4,-28 3,-14 3,0 Z" fill="#7a5547"/>
            <g transform="translate(7,-41)">
              <g class="canopy" style="--a:-2.4; --b:2.6; --dur:2.5s; --delay:-.9s">
                <circle cx="10"  cy="-6"  r="22" fill="#6b8f7d"/>
                <circle cx="46"  cy="-8"  r="24" fill="#79a08b"/>
                <circle cx="30"  cy="-32" r="34" fill="#7ea58f"/>
                <circle cx="8"   cy="-42" r="18" fill="#86ab98"/>
                <circle cx="56"  cy="-42" r="22" fill="#6a917c"/>
              </g>
            </g>
          </g>
        </g>

        <circle class="door-burst" cx="386" cy="258" r="100" fill="url(#burst)" pointer-events="none"/>

      </g>

      <g class="wind">
        <path pathLength="100" d="M158,176 C190,168 225,184 262,164"  style="--t:5.2s; --d:-.5s"/>
        <path pathLength="100" d="M40,224 C90,216 130,232 182,208"    style="--t:6.4s; --d:-3s"/>
        <path pathLength="100" d="M62,248 C100,244 130,252 160,238"   style="--t:4.6s; --d:-1.8s"/>
        <path pathLength="100" d="M30,383 C70,378 110,388 150,371"    style="--t:5.8s; --d:-4s"/>
        <path pathLength="100" d="M600,190 C650,182 700,196 752,176"  style="--t:5.5s; --d:-2.2s"/>
        <path pathLength="100" d="M645,222 C690,216 720,226 752,208"  style="--t:4.8s; --d:-.9s"/>
        <path pathLength="100" d="M480,276 C520,268 560,282 598,266"  style="--t:6.1s; --d:-3.6s"/>
        <path pathLength="100" d="M630,342 C670,336 710,344 752,324"  style="--t:5s;   --d:-1.4s"/>
        <path pathLength="100" d="M672,402 C710,398 740,404 770,394"  style="--t:6.8s; --d:-5s"/>
        <path pathLength="100" d="M100,140 C150,128 200,148 262,126"  style="--t:7s;   --d:-2.7s"/>
        <path pathLength="100" d="M520,120 C570,108 620,126 690,104"  style="--t:6.6s; --d:-4.4s"/>
        <path pathLength="100" d="M330,420 C380,412 430,428 490,408"  style="--t:5.6s; --d:-.2s"/>
      </g>

      <g id="leaves"></g>

      </g>
    </svg>
  </main>

  <p class="hint" id="hint">Ketuk pintunya</p>

  <div class="flash" id="flash" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
